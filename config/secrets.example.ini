; Intercom WebTab secrets. Copy to /etc/intercom-webtab/secrets.ini, owner root,
; group webtab, mode 0640. Never commit the real file.
; Values are taken literally: no inline comments here, so passwords may contain ';' or '#'.

[asterisk]
; Asterisk Manager Interface login (deploy/install.sh generates a random secret and
; writes the same login into /etc/asterisk/manager.conf).
ami_user = webtab
ami_secret = CHANGE_ME

[provider]
; Variant A only: your SIP account at the provider that delivers the door-panel calls.
host = sip.provider.example
port = 5060
username = 100
; auth_username = 100
password = CHANGE_ME

[panel:gate]
; Camera of the gate panel (optional). Without it, video comes through the SIP call.
; Keep the URL without credentials; they are added from rtsp_user / rtsp_password.
rtsp_url = rtsp://camera-gate.local:554/stream1
rtsp_user = viewer
rtsp_password = CHANGE_ME
; Variant B only: SIP password of the door station that registers to this Asterisk.
; sip_password = CHANGE_ME

[panel:door]
rtsp_url = rtsp://camera-door.local:554/stream1
rtsp_user = viewer
rtsp_password = CHANGE_ME
