; Intercom WebTab configuration.
; Copy to /etc/intercom-webtab/webtab.ini (deploy/install.sh does it for you) and edit.
; Passwords, camera URLs and the AMI login live in secrets.ini, not here.
; Comments start with ';' (also after a value). Restart the service after changes:
;   sudo systemctl restart intercom-webtab
; Check the file without starting anything:
;   python3 -m intercom_webtab --config /etc/intercom-webtab/webtab.ini --check

[station]
title = Intercom WebTab
log_level = info              ; debug | info | warning | error

[http]
bind = 0.0.0.0                ; address the page is served on
port = 8080

[paths]
token_file = /etc/intercom-webtab/token
secrets_file = /etc/intercom-webtab/secrets.ini
state_dir = /var/lib/intercom-webtab
; static_dir =                ; default: the page shipped with the package
; runtime_dir =               ; default: $RUNTIME_DIRECTORY (systemd) or a private temp dir

[location]
; The weather, air quality and radiation are shown for this point.
latitude = 51.4779
longitude = -0.0015
timezone = Europe/London      ; IANA time zone name

[units]
temperature = C               ; C | F
wind = m/s                    ; m/s | km/h | mph
pressure = hPa                ; hPa | mmHg | inHg

[weather]
enabled = on                  ; off: no network requests, the panel shows "not available"
photos = on                   ; weather photos behind the panel
attribution = on              ; data and photo credits on the page

[radiation]
provider = auto               ; auto | none | <provider id>
radius_km = 100

[ui]
ringtone = mid                ; low | mid | high | sweep
; six slots, in order; allowed: wind, air, uv, pressure, radiation, sun, humidity
widgets = wind, air, uv, pressure, radiation, sun

[sip]
; The station's own SIP endpoint. Asterisk rings it on localhost; keep it local.
uas_host = 127.0.0.1
uas_port = 5080
rtp_audio_port = 41000        ; even numbers; the next odd port carries RTCP
rtp_video_port = 41002
audio_out_port = 41100        ; guest audio from ffmpeg to the server (localhost)

[asterisk]
ami_host = 127.0.0.1
ami_port = 5038
trunk = provider              ; PJSIP endpoint of the SIP provider (empty if every panel has its own endpoint)
own_callerid = 100            ; our number: CallerID of our camera-view and door-opening calls
incoming_contexts = intercom-incoming   ; dialplan contexts of door-panel calls (comma separated)
view_context = intercom-view
view_exten = webtab
demo_context = intercom-demo

; One or two door panels. The id after "panel:" is used in the API and in secrets.ini.
[panel:gate]
label = Gate
icon = gate                   ; gate | house | door
number = 201                  ; the caller number this panel calls from
; endpoint = gate-station     ; door station registered to this Asterisk (variant B)
dtmf = 1                      ; digit(s) that open the door
open_settle = 2.0             ; s after the line comes up before the first digit
open_repeat = 0.7, 1.4, 2.1, 3.0   ; repeats of the digit after the first one, s
hold = 12                     ; s our door-opening call stays up (window for a second press)

[panel:door]
label = Entrance
icon = house
number = 202
dtmf = 1
open_settle = 2.0
open_repeat = 0.7, 1.4, 2.1, 3.0
hold = 12
