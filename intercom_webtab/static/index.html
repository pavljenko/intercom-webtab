<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png">

<title>Intercom WebTab</title>
<!-- Station config: the server replaces the placeholder below with JSON
     {"title", "panels":[{"id","label","icon"}], "ringtone", "attribution", "widgets"} (the "<" character escaped). -->
<script type="application/json" id="iwtConfig">__IWT_CONFIG__</script>
<script>
var VER = "2026.10.09-1";
/* guard: a separate first script. Even if the call core fails, pull-to-refresh, self-update, the
   watchdog and error reporting keep working here. The VER line above is the first one of its
   kind in this file: the server reads it for GET /api/ver. */
var IWT = (function(){
"use strict";
var D = {state:"idle", busy:false, busyAt:0, hb:0, wsAt:0, wsOn:false, httpAt:0, boot:false,
         pulling:false, gest:"", touched:false, facts:{}};
var T0 = Date.now(), SRCH = location.search;
function q(n){
  var m = SRCH.match(new RegExp("[?&]" + n + "=([^&]*)"));
  if (!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
}
var K = q("k") || "__TOKEN__";
D.K = K; D.q = q; D.ver = VER;
D.root = location.pathname === "/";
D.live = q("live") === "1";
/* preview (any path other than "/" without ?live=1): open, answer, view and hangup never reach
   the server */
D.preview = !D.root && !D.live;
D.mock = D.root ? null : q("mock");
D.demo = D.root ? null : q("demo");

/* Config injected by the server. Without it (a raw file, tests) the defaults apply: two panels,
   the "mid" ringtone. 1 or 2 panels; icon is gate | house | door. */
var CFG = {title:"Intercom WebTab", panels:[], ringtone:"mid", attribution:true, widgets:null};
(function(){
  var c = null, el = document.getElementById("iwtConfig");
  try{ c = JSON.parse(el.text || el.textContent || ""); }catch(e){}
  if (c && typeof c === "object") for (var k in c) if (c.hasOwnProperty(k)) CFG[k] = c[k];
  var ICONS = {gate:1, house:1, door:1}, out = [], seen = {};
  var list = CFG.panels instanceof Array ? CFG.panels : [];
  for (var i = 0; i < list.length && out.length < 2; i++){
    var p = list[i] || {}, id = p.id == null ? "" : String(p.id);
    if (!id || seen[id]) continue;
    seen[id] = 1;
    out.push({id:id, label:String(p.label || id), icon:ICONS[p.icon] ? p.icon : (out.length ? "house" : "gate")});
  }
  if (!out.length) out = [{id:"gate", label:"Gate", icon:"gate"}, {id:"door", label:"Entrance", icon:"house"}];
  CFG.panels = out;
  if (!({low:1, mid:1, high:1, sweep:1})[CFG.ringtone]) CFG.ringtone = "mid";
  try{
    var t = String(CFG.title || "Intercom WebTab");
    document.title = t;
    document.getElementById("appTitle").setAttribute("content", t);
  }catch(e){}
})();
D.cfg = CFG;

function hasC(el, c){ return !!el && (" " + el.className + " ").indexOf(" " + c + " ") >= 0; }
function addC(el, c){ if (el && !hasC(el, c)) el.className = el.className ? el.className + " " + c : c; }
function rmC(el, c){
  if (el && hasC(el, c)) el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, "");
}
function setC(el, c, on){ if (on) addC(el, c); else rmC(el, c); }
D.hasC = hasC; D.addC = addC; D.rmC = rmC; D.setC = setC;
function el(id){ return document.getElementById(id); }

var subs = {};
D.on = function(ev, fn){ (subs[ev] = subs[ev] || []).push(fn); };
D.emit = function(ev, a){
  var l = subs[ev] || [];
  for (var i = 0; i < l.length; i++){ try{ l[i](a); }catch(e){ D.err(e, "event " + ev); } }
};

/* Report to the server: an iPad has no console, so "why is it silent" would be guesswork */
D.diag = function(o){
  try{
    o = o || {}; o.ver = VER;
    if (!D.root) o.page = location.pathname;
    var x = new XMLHttpRequest(); x.open("POST", "/api/diag?k=" + K, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.send(JSON.stringify(o));
  }catch(e){}
};
/* JS errors go to diag: each distinct one once, at most 10 per hour */
var errSeen = {}, errLog = [];
window.onerror = function(msg, src, line){
  try{
    var key = String(msg) + "|" + line, now = Date.now();
    if (errSeen[key]) return false;
    while (errLog.length && now - errLog[0] > 3600000) errLog.shift();
    if (errLog.length >= 10) return false;
    errSeen[key] = 1; errLog.push(now);
    D.diag({err:String(msg).slice(0, 200), line:line || 0, where:"error"});
  }catch(e){}
  return false;
};
D.err = function(e, where){
  window.onerror((where ? where + ": " : "") + ((e && e.message) || e), "", (e && (e.line || e.lineNumber)) || 0);
};

/* cb(gotResponse, json, status). httpAt feeds the watchdog: "the server is alive". */
D.xhr = function(method, url, body, ms, cb){
  var done = false, x = null, timer = null;
  function fin(resp, data, st){
    if (done) return;
    done = true; clearTimeout(timer);
    if (resp) D.httpAt = Date.now();
    if (cb){ try{ cb(resp, data, st); }catch(e){ D.err(e, "reply " + url.split("?")[0]); } }
  }
  try{
    x = new XMLHttpRequest(); x.open(method, url, true);
    if (body != null) x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function(){
      if (x.readyState !== 4) return;
      var d = null;
      try{ d = JSON.parse(x.responseText); }catch(e){}
      fin(x.status > 0, d, x.status);
    };
    timer = setTimeout(function(){ fin(false, null, 0); try{ x.abort(); }catch(e){} }, ms || 15000);
    x.send(body != null ? JSON.stringify(body) : null);
  }catch(e){ fin(false, null, 0); }
};

/* client facts for the status line, shown above the server ones; ms: removes itself */
var factT = {};
D.fact = function(key, text, ms){
  clearTimeout(factT[key]);
  if (text){
    D.facts[key] = {text:text, c:1};
    if (ms) factT[key] = setTimeout(function(){ D.fact(key, null); }, ms);
  } else delete D.facts[key];
  D.emit("facts");
};

/* ---------- reload: only while the server answers ---------- */
var reloading = false, failAt = 0, msgT = null;
function rN(){ var r = parseInt(q("r"), 10); return r > 0 ? r : 0; }
function reloadUrl(n){
  var a = SRCH.replace(/^\?/, "").split("&"), keep = [];
  for (var i = 0; i < a.length; i++){
    var k = a[i].split("=")[0];
    if (a[i] && k !== "k" && k !== "_" && k !== "r") keep.push(a[i]);
  }
  return location.pathname + "?k=" + K + "&_=" + Date.now() + "&r=" + n + (keep.length ? "&" + keep.join("&") : "");
}
function ptrMsg(text, ms){
  var p = el("ptr"), t = el("ptrTx");
  if (!p || !t) return;
  clearTimeout(msgT);
  t.firstChild.textContent = text || ""; setC(p, "msg", !!text);
  if (text && ms) msgT = setTimeout(function(){ setC(p, "msg", false); }, ms);
}
function go(n){
  addC(el("stage"), "gone");
  setTimeout(function(){ location.replace(reloadUrl(n)); }, 160);
}
/* Never reload without an answer from the server: a Home-Screen web app would be left on an
   error page with no JS and no way out. A second manual pull within 10 s forces the reload.
   Watchdog: three reloads in a row, then a message and a 10 min pause after the last one, then
   at most one every 10 min: a wall-mounted station must recover on its own. */
function safeReload(why, manual){
  if (reloading) return;
  var now = Date.now();
  if (!manual){
    if (D.preview) return;
    var at = parseInt(q("_"), 10) || 0;
    if (rN() >= 3 && now - at < 600000){
      if (!D.facts.guard){
        D.fact("guard", "Station keeps failing — pull down to refresh");
        D.diag({where:"watchdog: reloads exhausted", why:why});
      }
      return;
    }
  }
  reloading = true;
  var n = manual ? 0 : rN() + 1;
  if (manual) ptrMsg("Refreshing…");
  if (manual && failAt && now - failAt < 10000){ go(n); return; }
  D.xhr("GET", "/api/ver?k=" + K + "&_=" + now, null, 4000, function(resp){
    if (resp){
      if (!manual) D.diag({where:"watchdog: reload", why:why});
      go(n); return;
    }
    reloading = false;
    if (manual){ failAt = Date.now(); ptrMsg("No connection to the server — pull again", 10000); }
  });
}
D.safeReload = safeReload;

/* ---------- pull to refresh ----------
   The direction is locked once, on the first move over 12 px: down means dy > 12 and
   |dx| < 0.6 dy, starting below y = 24 (above it is the iOS notification shade). Threshold 96 px;
   during a call or a camera view 160 px and only when starting outside the video and the
   buttons, so a conversation is never cut by accident. */
var P = {on:false, sx:0, sy:0, dy:0, lock:"", ok:false, thr:96};
function onLive(t){
  for (; t && t.nodeType === 1; t = t.parentNode) if (t.id === "live" || hasC(t, "btn")) return true;
  return false;
}
function stageTo(px, anim){
  var s = el("stage");
  if (!s) return;
  setC(s, "back", !!anim);
  var v = px ? "translateY(" + px + "px)" : "";
  s.style.webkitTransform = v; s.style.transform = v;
}
function ptrLine(f){
  var l = el("ptrLn");
  if (!l) return;
  var v = "scaleX(" + f + ")";
  l.style.webkitTransform = v; l.style.transform = v;
}
function touched(){ if (!D.touched){ D.touched = true; D.emit("touch"); } }
var OPT = {passive:false, capture:true};
document.addEventListener("touchstart", function(e){
  touched();
  D.pulling = false; D.gest = "";
  var t = e.touches && e.touches[0];
  P.on = !!t && e.touches.length === 1 && !reloading;
  P.lock = ""; P.dy = 0;
  if (!P.on) return;
  P.sx = t.clientX; P.sy = t.clientY;
  var calm = D.state === "idle" || !D.boot;
  P.thr = calm ? 96 : 160;
  P.ok = P.sy >= 24 && (calm || !onLive(e.target));
}, OPT);
document.addEventListener("click", touched, true);
// preventDefault on the document: otherwise iOS rubber-bands the whole page
document.addEventListener("touchmove", function(e){
  e.preventDefault();
  var t = e.touches && e.touches[0];
  if (!P.on || !t) return;
  var dx = t.clientX - P.sx, dy = t.clientY - P.sy;
  if (!P.lock){
    if (Math.abs(dx) <= 12 && Math.abs(dy) <= 12) return;
    P.lock = (P.ok && dy > 12 && Math.abs(dx) < 0.6 * dy) ? "pull" : "other";
    D.gest = P.lock;
    if (P.lock === "pull") D.pulling = true;
  }
  if (P.lock !== "pull") return;
  P.dy = dy > 0 ? dy : 0;
  stageTo(Math.min(120, Math.round(P.dy * 0.4)), false);
  ptrLine(Math.min(1, P.dy / P.thr));
  if (P.dy >= P.thr) ptrMsg("Release to refresh");
  else if (!failAt || Date.now() - failAt > 10000) ptrMsg("");
}, OPT);
function endPull(){
  if (!P.on) return;
  P.on = false;
  if (P.lock !== "pull") return;
  var ok = P.dy >= P.thr;
  stageTo(0, true); ptrLine(0);
  if (ok) safeReload("gesture", true);
  else if (!failAt || Date.now() - failAt > 10000) ptrMsg("");
}
document.addEventListener("touchend", endPull, OPT);
document.addEventListener("touchcancel", function(){ P.dy = 0; endPull(); }, OPT);

/* ---------- watchdog ----------
   Reload (through safeReload, at most 3 in a row) when: the core has not started within 30 s;
   the core timers are dead for over 60 s; the WebSocket is silent for over 3 min while HTTP
   works; "busy" for over 15 min. */
var lastTick = Date.now(), bootBy = T0 + 30000;
setInterval(function(){
  var now = Date.now();
  if (now - lastTick > 30000){
    // the page was in the background: nobody's timers ran, restart all countdowns
    lastTick = now; D.hb = now; D.wsAt = now; bootBy = Math.max(bootBy, now + 30000);
    if (D.busy) D.busyAt = now;
    return;
  }
  lastTick = now;
  if (!D.boot){
    if (now > bootBy){ bootBy = now + 600000; D.diag({where:"core did not start"}); safeReload("core"); }
    return;
  }
  if (D.hb && now - D.hb > 60000){ safeReload("core timers"); return; }
  if (D.wsOn && D.wsAt && now - D.wsAt > 180000 && D.httpAt && now - D.httpAt < 180000){ safeReload("ws silent"); return; }
  if (D.busy && D.busyAt && now - D.busyAt > 900000) safeReload("busy 15 min");
}, 15000);

/* ---------- self-update: a new page version or the reload flag on the server ----------
   Every 2 minutes and only when idle (a dead core counts as idle); only on "/": /api/ver
   reports the version of the production index.html, a preview does not compare with it. */
var firstReload = null;
setInterval(function(){
  if (!D.root || reloading) return;
  if (D.boot && D.state !== "idle") return;
  D.xhr("GET", "/api/ver?k=" + K, null, 15000, function(resp, d){
    if (!resp || !d || !d.ok) return;
    if (firstReload === null) firstReload = d.reload || 0;
    if ((d.ver && d.ver !== VER) || (d.reload || 0) > firstReload){ reloading = true; go(0); }
  });
}, 120000);

return D;
})();
</script>
<style>
/* Layout 1024x748 (iPad landscape below the status bar) in absolute coordinates.
   iOS 9: no flex, grid or CSS variables; visibility is driven by classes on #stage. */
* { margin:0; padding:0; -webkit-box-sizing:border-box; box-sizing:border-box; }
html, body { width:1024px; height:748px; overflow:hidden; background:#000; color:#F4F6F6;
  font-family:-apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
#stage { position:absolute; left:0; top:0; width:1024px; height:748px; overflow:hidden; background:#111; z-index:1; }
#stage.back { -webkit-transition:-webkit-transform .25s ease; transition:transform .25s ease; }
#stage.gone { opacity:0; -webkit-transition:opacity .15s ease; transition:opacity .15s ease; }
.a { position:absolute; white-space:nowrap; }

/* weather photo: two layers, cross-faded; the shade at the bottom left is baked into the photo,
   the right panel is a separate ready image (the same photo, blurred and darkened) */
.ph { position:absolute; left:0; top:0; width:1024px; height:748px; opacity:0;
  -webkit-transition:opacity 1.4s ease; transition:opacity 1.4s ease; }
.ph.on { opacity:1; }
.ph.now { -webkit-transition:none; transition:none; }
.ph .bg { position:absolute; left:0; top:0; width:1024px; height:748px; }
.ph .pd { position:absolute; left:640px; top:0; width:384px; height:748px; background:rgba(0,0,0,.45); }
.ph .pn { position:absolute; left:640px; top:0; width:384px; height:748px; }
.ph .pn.no { display:none; }

/* the panel video replaces the photo on the left; exactly one <img> for the stream */
#live { display:none; position:absolute; left:0; top:0; width:640px; height:748px; background:#000; }
#vimg { position:absolute; left:0; top:0; width:640px; height:748px;
  -webkit-object-fit:contain; object-fit:contain; }
#stage.live #live { display:block; }
#stage.live #left { display:none; }

/* big numbers and lines on the left */
.big { font:200 128px/151px -apple-system, system-ui, "Helvetica Neue", sans-serif; letter-spacing:-2px; color:#FFFFFF; }
#uM { display:none; -webkit-transform:scaleX(.5); transform:scaleX(.5); }
.w30 { font:400 30px/35px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:#FFFFFF; overflow:hidden; text-overflow:ellipsis; }
.t16 { font:400 16px/18px -apple-system, system-ui, "Helvetica Neue", sans-serif; overflow:hidden; text-overflow:ellipsis; }
#wS { color:#D2D9D9; }
#wL { color:#FFFFFF; -webkit-transition:opacity .4s ease; transition:opacity .4s ease; }
#wL.fade { opacity:0; }
#ico { position:absolute; left:0; top:608px; width:66px; height:54px; }

/* round 72 px buttons without captions; the close button has the same size, top left on the video.
   Icons are embedded as data URIs (base64 of static/buttons/*.svg: `base64 -i file.svg`), so the
   page needs no extra routes and no iPad cache. Gate and door are original drawings; house, lock,
   phone, refresh and x are Phosphor Icons (MIT, static/buttons/LICENSE-phosphor.txt). */
.btn { position:absolute; top:40px; width:72px; height:72px; border-radius:50%; background-color:rgba(255,255,255,.10);
  background-position:center; background-repeat:no-repeat; -webkit-background-size:30px 30px; background-size:30px 30px; }
/* feedback: a press sinks and lightens the button, a ring spreads on release; while waiting for
   the server an arc runs around it; "open" turns it green with two green rings; an error turns it
   red with a shake. All -webkit- animations: iOS 9 runs them without hurting the video. */
.btn { -webkit-transition:-webkit-transform .14s ease-out, background-color .2s; transition:transform .14s ease-out, background-color .2s; }
.btn.dn { -webkit-transform:scale(.9); transform:scale(.9); background-color:rgba(255,255,255,.28); }
.btn.on.dn { background-color:#FFFFFF; }
.rp { position:absolute; top:40px; width:72px; height:72px; border-radius:50%; -webkit-box-sizing:border-box; box-sizing:border-box;
  border:2px solid rgba(255,255,255,.75); opacity:0; pointer-events:none; }
.rp.go { -webkit-animation:rp .55s ease-out; animation:rp .55s ease-out; }
.rp.g { border-color:#7BD88F; }
.rp.d2 { -webkit-animation-delay:.22s; animation-delay:.22s; }
@-webkit-keyframes rp { 0% { opacity:.85; -webkit-transform:scale(1); } 100% { opacity:0; -webkit-transform:scale(1.5); } }
@keyframes rp { 0% { opacity:.85; transform:scale(1); } 100% { opacity:0; transform:scale(1.5); } }
.btn.wt:after { content:""; position:absolute; left:-6px; top:-6px; width:84px; height:84px; border-radius:50%;
  -webkit-box-sizing:border-box; box-sizing:border-box; border:2px solid rgba(255,255,255,.14); border-top-color:#FFFFFF;
  -webkit-animation:spin .8s linear infinite; animation:spin .8s linear infinite; }
@-webkit-keyframes spin { 100% { -webkit-transform:rotate(360deg); } }
@keyframes spin { 100% { transform:rotate(360deg); } }
.btn.sh { -webkit-animation:sh .42s ease-out; animation:sh .42s ease-out; }
@-webkit-keyframes sh { 20% { -webkit-transform:translateX(-7px); } 40% { -webkit-transform:translateX(6px); }
  60% { -webkit-transform:translateX(-4px); } 80% { -webkit-transform:translateX(2px); } }
@keyframes sh { 20% { transform:translateX(-7px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(2px); } }

#b3s.on { opacity:1; }

#stage.live #bX { display:block; }

.wl { position:absolute; font:400 12px/14px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:#A3ADAD; white-space:nowrap; }
.wc { position:absolute; font:400 12px/14px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:#C9D0D0; white-space:nowrap; }
.wn { width:164px; overflow:hidden; text-overflow:ellipsis; }   /* up to the next column (168) minus 4 px */
.dot { position:absolute; width:6px; height:6px; border-radius:50%; }
.val { font:300 40px/47px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:#FFFFFF; }
.rg { position:absolute; height:1px; }
.rb { position:absolute; width:14px; border-radius:2px 2px 0 0; }

/* data-source attribution: tiny, low contrast, vertical along the right edge of the bottom-right
   corner, inside the 32 px margin right of the widgets and the chart (x 1004-1015). Rotated about
   its top-left corner, so the box spans y 300-700 and the text reads bottom to top. */
#attr { position:absolute; left:1004px; top:700px; width:400px; height:11px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; font:400 9px/11px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:rgba(255,255,255,.45);
  -webkit-transform-origin:0 0; transform-origin:0 0; -webkit-transform:rotate(-90deg); transform:rotate(-90deg); }

/* pull to refresh: a progress line at the top and a short phrase */
#ptr { position:absolute; left:0; top:0; width:1024px; height:0; z-index:20; }
#ptrLn { position:absolute; left:0; top:0; width:1024px; height:2px; background:#F4F6F6; opacity:.7;
  -webkit-transform:scaleX(0); transform:scaleX(0); }
#ptrTx { display:none; position:absolute; left:0; top:40px; width:1024px; text-align:center; }
#ptr.msg #ptrTx { display:block; }
#ptrTx span { display:inline-block; padding:9px 18px; border-radius:20px; background:rgba(0,0,0,.72);
  font:400 16px/18px -apple-system, system-ui, "Helvetica Neue", sans-serif; color:#F4F6F6; }
</style>

<!-- dot-matrix weather icons: an EXACT copy of static/dots.js, so the server needs no /dots.js
     route and the iPad no cache. Edit static/dots.js and copy it here in full: the preview server
     and tests/test_page.py compare the two. -->
<script id="dotsJs">
// Dot-matrix weather icons: a 22x18 grid with a 3 px pitch (66x54). On a 1x iPad screen every dot
// lands exactly on 2x2 pixels with a 1 px gap, so nothing is blurred. Shapes are defined by geometry
// (circles, segments) and rasterized at the dot centers; an icon is built back to front from the
// "brushes" below. One frame is 150 ms, t grows forever (modulo FRAMES). ES5 only (iOS 9).
var DOTS = (function () {
  var C = 22, R = 18, P = 3;
  var OFF = "rgba(255,255,255,.10)", W = "#FFFFFF", GREY = "#8F9999", SUN = "#F2D37A", MOON = "#E6ECEC";
  var cW = "255,255,255", cSUN = "242,211,122", cMOON = "230,236,236", cDROP = "159,211,255",
      cICE = "210,244,255", cDUST = "217,165,94", cFOG = "216,222,222", cHOT = "242,153,74";
  function a(rgb, k) { return "rgba(" + rgb + "," + k + ")"; }

  // ---------- geometry ----------
  function circ(x, y, cx, cy, r) { var dx = x - cx, dy = y - cy; return dx * dx + dy * dy <= r * r; }
  function seg(x, y, ax, ay, bx, by, w) {                        // point within w of a segment
    var vx = bx - ax, vy = by - ay, k = ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy);
    k = k < 0 ? 0 : k > 1 ? 1 : k;
    var dx = ax + k * vx - x, dy = ay + k * vy - y;
    return dx * dx + dy * dy <= w * w;
  }
  // cloud 20x10 at k=1: big dome on the left, small one on the right, capsule base; (ox, oy) = top left
  function cloud(x, y, ox, oy, k) {
    x = (x - ox) / k; y = (y - oy) / k;
    if (y > 9.6) return false;
    return circ(x, y, 6.2, 5.2, 4.4) || circ(x, y, 13.6, 6.0, 3.6) || seg(x, y, 3.0, 7.8, 17.4, 7.8, 1.9);
  }
  function tri(t, half) { var m = t % (2 * half); return m < half ? m : 2 * half - m; }   // 0..half..0

  // ---------- brushes ----------
  function blank() { var g = [], x, y; for (y = 0; y < R; y++) { g[y] = []; for (x = 0; x < C; x++) g[y][x] = OFF; } return g; }
  function put(g, y, x, col) { if (y >= 0 && y < R && x >= 0 && x < C) g[y][x] = col; }
  function shape(g, test, col, halo) {                            // halo: one-dot gap around the shape
    var x, y;
    if (halo) for (y = 0; y < R; y++) for (x = 0; x < C; x++)
      if (!test(x, y) && (test(x - 1, y) || test(x + 1, y) || test(x, y - 1) || test(x, y + 1))) g[y][x] = OFF;
    for (y = 0; y < R; y++) for (x = 0; x < C; x++) if (test(x, y)) g[y][x] = col;
  }
  function cl(ox, oy, k) { return function (x, y) { return cloud(x, y, ox, oy, k); }; }
  function ray(ax, ay, bx, by) { return function (x, y) { return seg(x, y, ax, ay, bx, by, 0.55); }; }

  function sun(g, cx, cy, r, r1, r2, t, dim) {                    // disc + 8 rays, a glint runs around the rays
    shape(g, function (x, y) { return circ(x, y, cx, cy, r); }, dim ? a(cSUN, dim) : SUN);
    if (!r2) return;
    for (var i = 0; i < 8; i++) {
      var an = i * Math.PI / 4, s = Math.sin(an), c = Math.cos(an), q = (i - (t >> 1) + 800) % 8;
      shape(g, ray(cx + r1 * s, cy - r1 * c, cx + r2 * s, cy - r2 * c), q === 0 ? SUN : q === 1 || q === 7 ? a(cSUN, .7) : a(cSUN, .38));

    var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination);

}, 25000);
/* Street audio: raw 8 kHz PCM from the WebSocket. Old WebKit rejects createBuffer(..., 8000),
   so the samples are resampled to the context's NATIVE rate with linear interpolation. */
function playPCM(ab){
  if (!actx) return;

    var i16 = new Int16Array(ab), n = i16.length;
    if (!n) return;

    var buf = actx.createBuffer(1, outN, rate), ch = buf.getChannelData(0);
    for (var j = 0; j < outN; j++){
      var pos = j / k, i0 = pos | 0, fr = pos - i0;
      var a = i16[i0] || 0, b = (i0 + 1 < n) ? i16[i0 + 1] : a;
      ch[j] = (a + (b - a) * fr) / 32768;

    var src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    var now = actx.currentTime;
    // at most 0.35 s queued: otherwise latency piles up and audio keeps playing after "close"
    if (playAt < now || playAt > now + 0.35) playAt = now + 0.08;
    if (src.start) src.start(playAt); else if (src.noteOn) src.noteOn(playAt);

}

function stopPCM(){

    try{ if (pcmSrc[i].stop) pcmSrc[i].stop(0); else if (pcmSrc[i].noteOff) pcmSrc[i].noteOff(0); }catch(e){}
    try{ pcmSrc[i].disconnect(); }catch(e){}

/* Fallback beeps when the <audio> ringtone did not start: two square-wave tones in the pitch
   range of the configured ringtone, synthesized into a buffer (the same path as the street audio). */
var FALLBACK = ({low:[262, 330], mid:[523, 784], high:[1800, 2250], sweep:[400, 1600]})[D.cfg.ringtone] || [523, 784];
var RING_GAIN = 0.45;
function tone(f, dur, gain){
  if (!actx) return;
  try{
    var rate = actx.sampleRate || 44100, n = Math.max(1, Math.floor(rate * (dur || 0.28)));
    var buf = actx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
    var G = (gain == null ? 0.55 : gain), ramp = Math.max(1, Math.floor(rate * 0.008));
    for (var i = 0; i < n; i++){
      var s = (Math.sin(2 * Math.PI * f * (i / rate)) >= 0) ? 1 : -1;
      var env = Math.min(1, i / ramp, (n - i) / ramp);
      ch[i] = s * G * env;
    }
    var src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
  }catch(e){}
}
var ringT = null, ringChk = null;
function ring(on){
  if (on){
    if (D.demo) return;                    // demo: picture only
    diag("ringing: trying to play");       // shows whether the ring reached the sound stage
    // 1) main signal: the <audio> ringtone, not silenced by the mute switch
    var r = $("ringSnd");
    try{ if (r){ r.currentTime = 0; r.volume = 1; quiet(r.play()); } }catch(e){}
    if (ringChk || ringT) return;
    // 2) Web Audio fallback ONLY if the file did not start
    ringChk = setTimeout(function(){
      ringChk = null;
      var ok = r && !r.paused && r.currentTime > 0;
      if (ok || !actx) return;
      var hi = false;
      var play = function(){ tone(hi ? FALLBACK[1] : FALLBACK[0], 0.28, RING_GAIN); hi = !hi; };
      play(); ringT = setInterval(play, 300);
    }, 700);
  } else {
    if (ringChk){ clearTimeout(ringChk); ringChk = null; }
    if (ringT){ clearInterval(ringT); ringT = null; }
    try{ var r2 = $("ringSnd"); if (r2){ r2.pause(); r2.currentTime = 0; } }catch(e){}
  }
}

/* ---------- panel buttons from the config ---------- */
var PB = [];
(function(){
  var stage = $("stage"), b3 = $("b3"), X = [672, 796];
  for (var i = 0; i < PANELS.length; i++){
    var b = document.createElement("div");
    b.className = "btn pb ic-" + PANELS[i].icon;
    b.id = "pb" + i;
    b.style.left = X[i] + "px";
    b.setAttribute("aria-label", PANELS[i].label);
    stage.insertBefore(b, b3);
    PB.push({el:b, id:PANELS[i].id});
  }
})();

/* ---------- state: idle | ring | talk | view ---------- */
var ST = {mode:"idle", panel:null, opening:false, openSeq:0, viewSeq:0, b3:null};
var OPEN_LINGER = 20000, VIEW_TIMEOUT = 90000, BTN_GUARD = 700, OK_MS = 4000;
var BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
var btnAt = 0, b3T = null;
function setState(s){
  var was = D.busy;
  ST.mode = s; D.state = s; D.busy = s !== "idle";
  if (D.busy && !was) D.busyAt = Date.now();
  D.emit("state", s);
}
/* /stream serves whatever the server is showing now; panel is a hint for the preview server */
function vsrc(p){ return "/stream?k=" + K + "&t=" + Date.now() + (D.root ? "" : "&panel=" + encodeURIComponent(p)); }
function liveOn(p, withSrc){
  ST.panel = p;
  setC($("stage"), "live", true);
  if (withSrc) $("vimg").src = vsrc(p);
  btnAt = Date.now();
}
function liveOff(){
  $("vimg").src = BLANK;                   // a new src closes the MJPEG connection
  setC($("stage"), "live", false);
}
/* highlight: the panel on screen is white with a dark icon; the third button is Answer while
   ringing, Open during a call or a view, Refresh when idle; ok: green for a few s after opening */
function paintBtns(){
  var live = ST.mode !== "idle";
  for (var i = 0; i < PB.length; i++) setC(PB[i].el, "on", live && ST.panel === PB[i].id);
  var k = ST.b3 || (ST.mode === "ring" ? "an" : ST.mode === "idle" ? "rf" : "");
  setC($("b3"), "an", k === "an"); setC($("b3"), "ok", k === "ok"); setC($("b3"), "rf", k === "rf");
}
function b3Flash(k, ms){

  if (k && ms) b3T = setTimeout(function(){ ST.b3 = null; paintBtns(); }, ms);
}
/* an error over the video: the status line is hidden, so the button turns red and shakes */
function blink(el){
  setC(el, "er", true); ripple(el, "", 0, true);
  clearTimeout(el._erT); el._erT = setTimeout(function(){ setC(el, "er", false); }, 900);
}
/* a ring spreading from the button: white on a press, two green ones in a row on "open".
   Rings are separate elements next to the button (the button's :after is the waiting arc) */
function ringEl(el, i){
  var k = "_rp" + i;
  if (!el[k]){
    el[k] = document.createElement("div");
    el[k].style.left = el.offsetLeft + "px";
    el.parentNode.insertBefore(el[k], el);
  }
  return el[k];
}
function ripple(el, cls, n, shake){
  try{
    for (var i = 0; i < (n || 1); i++){
      var r = ringEl(el, i);
      r.className = "rp";
      void r.offsetWidth;                        // restart the animation
      r.className = "rp go" + (cls ? " " + cls : "") + (i ? " d2" : "");
    }
    if (shake){ setC(el, "sh", false); void el.offsetWidth; setC(el, "sh", true); }
  }catch(e){}
}
var capT = null;
function cap(text, cls, ms){
  var c = $("b3s"); clearTimeout(capT);
  if (!text){ setC(c, "on", false); return; }
  c.textContent = text; c.className = "on" + (cls ? " " + cls : "");
  if (ms) capT = setTimeout(function(){ setC(c, "on", false); }, ms);
}
/* an error while idle: a short phrase in the status line */
function say(text){ D.fact("err", text, 6000); }
function capital(s){ s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }

/* back to idle: a view after 90 s without touches, after Open after 20 s without touches */
var ret = {t:null, ms:0};
function armReturn(ms){ ret.ms = ms; restartReturn(); }
function restartReturn(){
  clearTimeout(ret.t);
  if (!ret.ms) return;
  ret.t = setTimeout(function(){ ret.ms = 0; closeAct(); }, ret.ms);
}
function disarmReturn(){ clearTimeout(ret.t); ret.ms = 0; }
document.addEventListener("touchstart", function(){ if (ret.ms) restartReturn(); }, false);
document.addEventListener("click", function(){ if (ret.ms) restartReturn(); }, false);

function toIdle(){
  if (ST.opening) cap("");                      // opening interrupted: do not leave "Opening..."
  ST.openSeq++; ST.viewSeq++; ST.opening = false;
  clearTimeout(ringLater); ringLater = null;
  disarmReturn();
  ring(false); stopPCM();
  liveOff();
  clearTimeout(b3T); ST.b3 = null;
  setC($("b3"), "wt", false);
  ST.panel = null;
  setState("idle");
  paintBtns();
}

/* ---------- call events ---------- */
/* When the WebSocket reconnects in the middle of a call, the server repeats "ringing" followed
   at once by "answered". During a call with the same panel "ringing" waits up to 1.5 s for
   "answered": if it comes, it was a repeat and nothing changes (otherwise the ringtone would
   start, the Open button and the return timer would be lost). If not, the previous call ended
   without our "ended" and a new visitor is calling. */
var ringLater = null;
function ringEv(m){
  var p = pid(m.panel);
  clearTimeout(ringLater); ringLater = null;
  if (ST.mode === "talk" && ST.panel === p){
    ringLater = setTimeout(function(){ ringLater = null; onRinging(m); }, 1500);
    return;
  }
  onRinging(m);
}
function onRinging(m, silent){
  var p = pid(m.panel);
  // video and ringtone first: whatever breaks below, the call is seen and heard
  try{
    var same = (ST.mode === "ring" || ST.mode === "talk") && ST.panel === p;
    liveOn(p, !same);
  }catch(e){ D.err(e, "ringing: video"); }
  if (!silent) ring(true);
  try{ ST.viewSeq++; ST.openSeq++; ST.opening = false; disarmReturn(); setState("ring"); }catch(e){ D.err(e, "ringing: state"); }
  try{ stopPCM(); }catch(e){ D.err(e, "ringing: view audio"); }      // no street audio before answering
  try{ clearTimeout(b3T); ST.b3 = null; setC($("b3"), "wt", false); cap(""); paintBtns(); }catch(e){ D.err(e, "ringing: buttons"); }
  try{ if (actx && actx.state === "suspended" && actx.resume) actx.resume(); }catch(e){}
}
function onAnswered(m){
  clearTimeout(ringLater); ringLater = null;                // a repeated ringing after a reconnect
  // the page loaded in the middle of a call: show it without ringing
  if (ST.mode !== "ring" && ST.mode !== "talk") onRinging(m, true);
  ring(false);
  try{
    if (ST.mode !== "talk"){ setState("talk"); btnAt = Date.now(); }   // Answer became Open: deaf for 700 ms
    paintBtns();
  }catch(e){ D.err(e, "answered: buttons"); }
}
/* "ended" only acts during a call: the server sends it on every WebSocket reconnect */
function onEnded(){ if (ST.mode === "ring" || ST.mode === "talk") toIdle(); }

/* ---------- requests ---------- */
/* preview: open/answer/view/hangup are not sent, only logged to the console. Success is only
   simulated against the preview server stub (its hello carries stub). Against a real server a
   preview turns Answer and Open red: never green while the door stays shut and a visitor waits. */
var stubWS = false;
function send(path, body, cb){
  if (D.preview){
    try{ console.log("preview: /api/" + path + " not sent", JSON.stringify(body)); }catch(e){}
    if (cb) setTimeout(function(){
      var real = !stubWS && (path === "open" || path === "answer");
      var bad = real || (D.q("sim") === "err" && path !== "hangup");
      cb(true, bad ? {ok:false, err:real ? "preview: not sent" : "another panel is ringing"} : {ok:true, preview:true},
         bad ? 409 : 200);
    }, 400);
    return;
  }

}
function closeAct(){
  if (ST.mode === "ring" || ST.mode === "talk") send("hangup", {scope:"call", panel:ST.panel});
  else if (ST.mode === "view") send("hangup", {scope:"view", panel:ST.panel});
  else return;

}
function openDoor(){
  if (ST.opening) return;

  ST.opening = true;
  disarmReturn();
  setC(b, "wt", true);
  cap("Opening the " + lc(name) + "…");
  send("open", {panel:p}, function(resp, d){
    if (my !== ST.openSeq) return;             // the answer came after a state change
    ST.opening = false;
    setC(b, "wt", false);
    if (resp && d && d.ok){
      b3Flash("ok", OK_MS);                    // green button, two green rings and the caption
      ripple(b, "g", 2);
      cap(d.demo ? "Demo: nothing was opened" : name + " open", "g", OK_MS + 1500);
      armReturn(OPEN_LINGER);
      if (d.demo) diag("demo: nothing was opened");
    } else {
      blink(b);                                // 409 another panel is ringing, busy, no connection
      cap(d && d.err ? capital(d.err) : resp ? "Did not open — tap again" : "No connection to the server", "r", 5000);
      if (ST.mode === "view") armReturn(VIEW_TIMEOUT);
    }
  });
}
function answer(){
  var p = ST.panel, b = $("b3");
  setC(b, "wt", true);
  send("answer", {}, function(resp, d){
    setC(b, "wt", false);
    if (ST.mode !== "ring" || ST.panel !== p) return;
    if (resp && d && d.ok) onAnswered({panel:p});   // the WebSocket event follows, it changes nothing
    else blink($("b3"));
  });
}
function startView(p){
  var my = ++ST.viewSeq;
  ST.openSeq++; ST.opening = false;
  clearTimeout(b3T); ST.b3 = null;
  stopPCM();
  // the stream src only after the server answers: until then /stream shows the previous camera
  liveOn(p, D.preview);
  if (!D.preview) $("vimg").src = BLANK;
  setState("view");
  paintBtns();
  armReturn(VIEW_TIMEOUT);
  send("view", {panel:p}, function(resp, d){
    if (my !== ST.viewSeq || ST.mode !== "view") return;
    if (!resp || !d || !d.ok){
      toIdle();
      say(d && d.err ? capital(d.err) : resp ? "Camera unavailable" : "No connection to the server");
      return;
    }
    $("vimg").src = vsrc(p);
  });
}

/* ---------- buttons ---------- */
function tapPanel(p){
  if (ST.mode === "ring" || ST.mode === "talk") return;   // no camera switching during a call
  if (ST.mode === "view" && ST.panel === p) return;        // already on screen
  startView(p);
}
function tapB3(){
  if (ST.mode === "ring") answer();
  else if (ST.mode === "talk" || ST.mode === "view") openDoor();
  else if (ST.mode === "idle") D.safeReload("button", true);   // idle: Refresh
}
/* tap: cancelled by a move over 12 px and during a pull; deaf for 700 ms after the buttons
   change; preventDefault in every touchend branch, the synthetic click after a touch is ignored */
var lastTouchEnd = 0;
function tap(el, fn){
  var sx = 0, sy = 0, live = false;
  function fire(){
    if (D.pulling || Date.now() - btnAt < BTN_GUARD) return;
    ripple(el);
    unlockAudio();
    try{ fn(); }catch(e){ D.err(e, "button " + el.id); }
  }
  el.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    live = e.touches.length === 1; sx = t.clientX; sy = t.clientY;
    if (live) setC(el, "dn", true);
  }, false);
  el.addEventListener("touchmove", function(e){
    var t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12){ live = false; setC(el, "dn", false); }

for (var bi = 0; bi < PB.length; bi++) tap(PB[bi].el, tapPanelFn(PB[bi].id));
tap($("b3"), tapB3);

/* ---------- WebSocket: the call channel ----------
   Watchdog: the server sends a pulse {"ev":"ka","vage":...} every 5 s. iOS does NOT tell the page

   than WS_QUIET means: drop the socket ourselves and reconnect. */

  var proto = location.protocol === "https:" ? "wss" : "ws", u = proto + "://" + location.host + "/ws?k=" + K;
  if (D.demo) u += "&demo=" + encodeURIComponent(D.demo) + "&panel=" + encodeURIComponent(D.q("panel") || "");
  return u;

  clearTimeout(wsTimer); wsTimer = null;
  if (ws){ try{ ws.onopen = ws.onclose = ws.onmessage = ws.onerror = null; ws.close(); }catch(e){} }

  catch(e){ ws = null; wsTimer = setTimeout(connect, 2000); return; }
  ws.binaryType = "arraybuffer";
  ws.onopen = function(){ wsLast = Date.now(); D.wsAt = wsLast; };
  ws.onclose = function(){ clearTimeout(wsTimer); wsTimer = setTimeout(connect, 2000); };
  ws.onmessage = function(e){
    wsLast = Date.now(); D.wsAt = wsLast;
    if (typeof e.data === "string"){
      var m;
      try{ m = JSON.parse(e.data); }catch(err){ return; }
      if (m.ev === "call"){
        if (m.state === "ringing") ringEv(m);
        else if (m.state === "answered") onAnswered(m);
        else if (m.state === "ended") onEnded();
      } else if (m.ev === "hello"){
        stubWS = !!m.stub;                                           // the preview server stub
      } else if (m.ev === "view"){
        if (m.state === "ended" && ST.mode === "view") toIdle();   // the panel ended the SIP view itself
      }
    } else if (!D.preview && (ST.mode === "talk" || ST.mode === "view")) playPCM(e.data);   // no PCM before answering
  };
}
function wsCheck(){
  var now = Date.now();
  if (!ws) return;
  if (ws.readyState === 1 && now - (wsLast || wsBorn) > WS_QUIET) connect();
  else if (ws.readyState === 0 && now - wsBorn > 15000) connect();      // stuck while connecting

D.wsOn = true;
connect();
// back on screen (unlock, return from another app): check at once
document.addEventListener("visibilitychange", function(){ if (!document.hidden) wsCheck(); }, false);
window.addEventListener("pageshow", function(){ wsCheck(); }, false);
D.hb = Date.now();
setInterval(function(){ D.hb = Date.now(); wsCheck(); }, 5000);

/* ---------- demo (never on "/"): ?demo=view starts a view; ?act=open taps Open by itself ---------- */
if (!D.root){
  if (D.demo === "view") setTimeout(function(){ startView(pid(D.q("panel"))); }, 50);
  if (D.q("act") === "open"){
    var actDone = false;
    D.on("state", function(s){
      if (actDone || (s !== "talk" && s !== "view")) return;
      actDone = true;
      setTimeout(function(){ btnAt = 0; tapB3(); }, 150);
    });
  }
}

paintBtns();
D.boot = true;
diag("page loaded");
})();

function side(tab, ch, d){ if (!tab) return d; var i = tab[0].indexOf(ch); return i < 0 ? d : tab[1][i]; }
function lsb(k, s){ return side(M[k].l, s.charAt(0), M[k].d); }
function rsb(k, s){ return side(M[k].r, s.charAt(s.length - 1), M[k].d); }
function ink(k, s){ return s ? adv(k, s) - lsb(k, s) - rsb(k, s) : 0; }      // ink width of a line
/* The DOM baseline of a line is measured with a probe (a zero-height inline-block sits on the
   baseline), independent of iOS 9 font metrics. Once per style. */
var BASE = {};
function baseOf(k){
  if (BASE[k]) return BASE[k];
  var host = $("stage"), d = document.createElement("div"), s = document.createElement("span"), v = 0;
  d.className = "a " + k; d.style.cssText = "left:0;top:0;visibility:hidden";
  d.appendChild(document.createTextNode("0"));
  s.style.cssText = "display:inline-block;width:1px;height:0;vertical-align:baseline";
  d.appendChild(s); host.appendChild(d);
  try{ v = s.getBoundingClientRect().top - d.getBoundingClientRect().top; }catch(e){}
  host.removeChild(d);
  if (v > 0) BASE[k] = v;
  return v > 0 ? v : 0.8 * parseInt(M[k].f.split(" ")[1], 10);
}
/* left edge of the ink at x, baseline at y; returns the ink width */
function put(el, k, text, x, y){
  el.textContent = text;
  el.style.left = (x - lsb(k, text)).toFixed(1) + "px";
  el.style.top = (y - baseOf(k)).toFixed(1) + "px";
  return ink(k, text);
}

/* ---------- photo: two layers, switched after both images of the new one have loaded ----------
   A cross-fade where the background never shows through. phB lies above phA (DOM order): a new
   photo on top fades in over the intact old one, and the old one is cleared once hidden; a new
   photo below (and the very first one) appears at once while the old one on top fades out. */
var ph = {front:null, key:null, want:null};
// the token as for /stream: if the /ph/ route checks it, an image without k would not load
function withK(u){ return u + (u.indexOf("?") < 0 ? "?" : "&") + "k=" + K; }
function loadInto(img, url, cb){
  img.onload = img.onerror = function(){ img.onload = img.onerror = null; cb(); };
  img.src = url;
}
function paintPhoto(p){
  $("stage").style.backgroundColor = (p && p.tone) || "#111";
  if (!p || !p.bg){
    ph.key = ph.want = ph.front = null;
    D.rmC($("phA"), "now"); D.rmC($("phA"), "on"); D.rmC($("phB"), "on");
    return;
  }
  var key = p.key || p.bg;
  if (key === ph.key || key === ph.want) return;
  ph.want = key;
  var back = ph.front === $("phA") ? $("phB") : $("phA");
  var im = back.getElementsByTagName("img"), left = p.panel ? 2 : 1;
  D.setC(im[1], "no", !p.panel);
  function done(){
    if (--left > 0 || ph.want !== key) return;
    var A = $("phA"), B = $("phB");
    if (back === B){
      D.rmC(B, "now"); D.addC(B, "on");
      setTimeout(function(){ if (ph.front !== A){ D.addC(A, "now"); D.rmC(A, "on"); } }, 1600);
    } else {
      D.addC(A, "now"); D.addC(A, "on");
      D.rmC(B, "now"); D.rmC(B, "on");
    }
    ph.front = back; ph.key = key; ph.want = null;
    var nx = (p.next || [])[0];                   // preload the next one
    if (nx){ if (nx.bg) (new Image()).src = withK(nx.bg); if (nx.panel) (new Image()).src = withK(nx.panel); }
  }
  loadInto(im[0], withK(p.bg), done);
  if (p.panel) loadInto(im[1], withK(p.panel), done);
}

/* ---------- left: feels like, icon, condition word, in the shade, status line ---------- */
var BL = 700, TOPL = BL - M.big.cap, TX = 0;
function paintLeft(n){
  n = n || {};
  var big = String(n.utciTxt || "—"), uM = $("uM"), uN = $("uN"), w;
  if (big.charAt(0) === "−" && big.length > 1){
    // a minus half as wide: same weight and height, squeezed towards its left edge
    var rest = big.slice(1), ml = side(M.big.l, "−", M.big.d), mr = side(M.big.r, "−", M.big.d);
    var mw = adv("big", "−") - ml - mr, gap = mr + lsb("big", rest);     // minus-to-digit gap as typeset
    put(uM, "big", "−", 44, BL);
    uM.style.webkitTransformOrigin = ml + "px 50%"; uM.style.transformOrigin = ml + "px 50%";
    uM.style.display = "block";
    var dx = Math.round(mw * 0.5 + gap * 0.75);
    w = dx + put(uN, "big", rest, 44 + dx, BL);
  } else {
    uM.style.display = "none";
    w = put(uN, "big", big, 44, BL);
  }
  // the canvas x is rounded, otherwise the 2x2 dots blur on a 1x screen; the lines to its right
  // keep the fractional x
  var ix = 44 + w + 28;
  $("ico").style.left = Math.round(ix) + "px";
  $("ico").style.top = Math.round(TOPL) + "px";
  TX = ix + 66 + 24;
  // right edge of the lines: 8 px before the panel (longer text gets an ellipsis)
  var wb = TOPL + M.w30.cap, maxW = 632 - TX;
  put($("wW"), "w30", String(n.word || ""), TX, wb);
  put($("wS"), "t16", "In the shade " + (n.tTxt || "—"), TX, wb + 26);
  $("wW").style.width = $("wS").style.width = $("wL").style.width = Math.max(40, maxW + 2) + "px";
  showSt();
}

/* dot icon: animated only when idle; the timer stops during video */
var icoT = null, icoF = 0, scene = "not-available";
function icoRun(){
  clearInterval(icoT); icoT = null;
  var DOTS = window.DOTS;
  if (!DOTS) return;
  var g = $("ico").getContext("2d");
  try{ DOTS.draw(g, scene, icoF); }catch(e){ D.err(e, "icon"); return; }
  if (D.state !== "idle") return;
  icoT = setInterval(function(){
    icoF = (icoF + 1) % DOTS.FRAMES;
    try{ DOTS.draw(g, scene, icoF); }catch(e){ clearInterval(icoT); }
  }, DOTS.STEP);
}
function setScene(s){
  s = s || "not-available";
  if (s === scene && icoT) return;
  scene = s; icoRun();
}
D.on("state", icoRun);

/* status line: client facts above the server ones; rotation every 8 s with rot (400 ms fade) */
var data = null, failN = 0, failTxt = "", stItems = [], stI = 0, stKey = "";
function clientFacts(){
  var out = [], f = D.facts;
  if (f.err) out.push(f.err);
  if (failN > 0) out.push({text:failTxt, c:1});
  if (f.guard) out.push(f.guard);
  if (!D.touched && !D.mock && !D.demo) out.push({text:"Sound is off — tap the screen", c:1});
  return out;
}
function showSt(){
  var s = stItems[stI];
  put($("wL"), "t16", s ? String(s.text || "") : "", TX, BL);
}
function paintStatus(){
  var srv = (data && data.status) || [], list = clientFacts(), rot = !!(data && data.rot);
  for (var i = 0; i < srv.length; i++) if (i === 0 || (rot && srv[i].P <= 3)) list.push(srv[i]);
  var key = JSON.stringify(list);
  if (key === stKey) return;
  stKey = key; stItems = list; stI = 0; showSt();
}
setInterval(function(){
  if (stItems.length < 2) return;
  var el = $("wL");
  D.addC(el, "fade");
  setTimeout(function(){ stI = (stI + 1) % stItems.length; showSt(); D.rmC(el, "fade"); }, 400);
}, 8000);
D.on("facts", paintStatus);
D.on("touch", paintStatus);

/* ---------- 2x3 widgets: name + level dot, value + unit, note ---------- */
var WNAME = {wind:"Wind", air:"Air", uv:"UV index", pressure:"Pressure", radiation:"Radiation", sun:"Sun", humidity:"Humidity"};
var WORDER = D.cfg.widgets instanceof Array ? D.cfg.widgets : ["wind", "air", "uv", "pressure", "radiation", "sun"];
var WG = [], PX = 672, WY = 164, WW = 152, PITCH = 108, G = 16;
(function(){
  var host = $("wg");
  for (var i = 0; i < 6; i++){
    var x = PX + (i % 2) * (WW + G), y = WY + Math.floor(i / 2) * PITCH;
    var s = {x:x, y:y, l:mk("wl", host), d:mk("dot", host), v:mk("a val", host), u:mk("wc", host), n:mk("wc wn", host)};
    s.l.style.left = x + "px"; s.l.style.top = y + "px";
    s.d.style.top = (y + 4) + "px";
    s.u.style.color = "#A3ADAD";
    s.n.style.left = x + "px";
    WG.push(s);
  }
})();
function paintWidgets(list){
  for (var i = 0; i < 6; i++){
    var it = (list && list[i]) || {}, s = WG[i], name = String(it.name || WNAME[it.k || WORDER[i]] || "");
    s.l.textContent = name;
    cx.font = "400 12px " + SF;
    s.d.style.left = Math.round(s.x + cx.measureText(name).width + 7) + "px";
    var L = it.L;
    s.d.style.backgroundColor = L === -1 ? SUN : (L == null || L < 0) ? NODATA : LC[Math.min(4, L | 0)];
    var base = s.y + 26 + M.val.cap, val = (it.val == null || it.val === "") ? "—" : String(it.val);
    var vw = put(s.v, "val", val, s.x, base);
    s.u.textContent = it.unit || "";
    s.u.style.left = (s.x + vw + 6).toFixed(1) + "px"; s.u.style.top = (base - 12).toFixed(1) + "px";
    s.n.textContent = it.note || "";
    s.n.style.top = (base + 10).toFixed(1) + "px";
  }
}

/* ---------- chance of precipitation: 9 bars (this hour + 8), scale 0/50/100 % ---------- */
var PH = 100, YB = 700 - 22, X0 = PX + 34, STEP = (992 - X0) / 9, RB = [], RH = [];
(function(){
  var host = $("rn"), t = mk("wl", host);
  t.textContent = "Chance of precipitation";
  t.style.left = PX + "px"; t.style.top = (YB - PH - 32) + "px";
  var V = [100, 50, 0];
  for (var j = 0; j < 3; j++){
    var yy = YB - V[j] / 100 * PH, g = mk("rg", host), lb = mk("wc", host);
    g.style.cssText = "left:" + X0 + "px;top:" + yy + "px;width:" + (992 - X0) + "px;background:rgba(255,255,255," + (V[j] ? ".10" : ".22") + ")";
    lb.style.cssText = "left:" + (PX - 2) + "px;top:" + (yy - 7) + "px;width:28px;text-align:right;color:#7E8888";
    lb.textContent = V[j] + "%";
  }
  for (var h = 0; h < 9; h++){
    var bx = Math.round(X0 + h * STEP + (STEP - 14) / 2), b = mk("rb", host), hl = mk("wc", host);
    b.style.left = bx + "px";
    hl.style.cssText = "left:" + (bx - 13) + "px;top:" + (YB + 10) + "px;width:40px;text-align:center;color:" + (h === 0 ? "#FFFFFF" : "#A3ADAD");
    RB.push(b); RH.push(hl);
  }
})();
function paintRain(r){
  var cols = (r && r.cols) || [], gray = !!(r && r.gray);
  for (var h = 0; h < 9; h++){
    var c = cols[h], pp = c && typeof c.pp === "number" ? c.pp : null;
    var bh = pp == null ? 2 : Math.max(2, Math.round(Math.max(0, Math.min(100, pp)) / 100 * PH));
    RB[h].style.top = (YB - bh) + "px"; RB[h].style.height = bh + "px";
    RB[h].style.backgroundColor = (gray || pp == null) ? NODATA : BAND(pp);
    RH[h].textContent = c && c.h != null ? String(c.h) : "";
  }
}

/* data-source attribution (required by the data licenses), unless [weather] attribution = off */
function paintAttr(d){
  $("attr").textContent = D.cfg.attribution === false ? "" : String((d && d.attribution) || "");
}

/* ---------- data: GET /api/panel at start and every 120 s ---------- */
function paint(d){
  data = d;
  var n = d.now || {};
  try{ paintPhoto(d.photo); }catch(e){ D.err(e, "photo"); }
  try{ paintLeft(n); }catch(e){ D.err(e, "left"); }
  try{ setScene(n.scene); }catch(e){ D.err(e, "icon"); }
  try{ paintWidgets(d.widgets); }catch(e){ D.err(e, "widgets"); }
  try{ paintRain(d.rain); }catch(e){ D.err(e, "precipitation"); }
  try{ paintAttr(d); }catch(e){ D.err(e, "attribution"); }
  try{ paintStatus(); }catch(e){ D.err(e, "status"); }
}
function url(){
  return "/api/panel?k=" + K + "&v=" + encodeURIComponent(D.ver) + (D.mock ? "&mock=" + encodeURIComponent(D.mock) : "");
}
function load(){
  D.xhr("GET", url(), null, 15000, function(resp, d){
    if (resp && d && d.v){ failN = 0; paint(d); }
    else {
      failN++;
      failTxt = resp ? "No weather data" : "No connection to the server — pull down";
      paintStatus();
    }
  });
}
try{ paintLeft({}); paintWidgets(null); paintRain(null); setScene(null); }catch(e){ D.err(e, "placeholder"); }
load();
setInterval(load, 120000);
paintStatus();
})();
</script>
